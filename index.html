<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="img/train-logo.png">

    <!--r bootstrap icon -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!--r css -->
    <link rel="stylesheet" href="css/style.css">

    <!--r javascript -->
    <script defer src="script.js"></script>
    <title>Aquisto biglietti</title>
</head>

<body>

    <header>

        <nav class="flex-container">

            <a href="#">
                <img id="train-logo" src="img/train-logo.png" alt="icon">
            </a>

            <div id="container-search-bar">
                <label for="search-bar">
                    <i class="bi bi-search"></i>
                </label>
                <input id="search-bar" type="search">
            </div>

            <div id="dropdown">
                <div id="dropdown-start">
                    <i class="bi bi-list"></i>
                </div>

                <ul id="dropdown-list">
                    <li value="home">
                        <a href="#">Home</a>
                    </li>

                    <li value="user">
                        <a href="#">Account</a>
                    </li>

                    <li value="help">
                        <a href="#">Aiuto</a>
                    </li>
                </ul>
            </div>
        </nav>

        <div class="flex-container">
            <div id="train-img"></div>
            <img src="img/testa-treno-stilizzato.png" id="train-head" alt="train-head">
        </div>

    </header>

    <main class="container">

        <form class="card">

            <h2>Compila questi 2 campi e clicca su invia</h2>

            <div>
                <label for="km">Quanti km dovete fare?</label>
                <input type="text" id="km">
            </div>

            <div>
                <label for="age">Quanti anni hai/ha?</label>
                <input type="text" id="age">
            </div>

            <button type="submit" id="submit-button">Invia</button>

        </form>

        <section class="card">

            <h2>Qui hai i tuoi risultati</h2>

            <ul>
                <li id="inputted-km">Chilometri inseriti: <span class="bedge">0 km</span></li>
                <li id="inputted-age">Età inserita: <span class="bedge">0 anni</span></li>
                <li id="ticket-price">Prezzo del Biglietto: <span class="bedge">0,00€</span></li>
            </ul>

        </section>

    </main>

</body>

</html>
