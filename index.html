<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="img/train-logo.png">

    <!--r bootstrap icon -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!--r css -->
    <link rel="stylesheet" href="css/style.css">

    <!--r javascript -->
    <script defer src="script.js"></script>
    <title>Aquisto biglietti</title>
</head>

<body>

    <header>

        <nav>

            <a href="#">
                <img id="train-logo" src="img/train-logo.png" alt="icon">
            </a>

            <div id="container-search-bar">
                <label for="search-bar">
                    <i class="bi bi-search"></i>
                </label>
                <input id="search-bar" type="search">
            </div>

            <div id="dropdown">
                <div id="dropdown-start">
                    <i class="bi bi-list"></i>
                </div>

                <ul id="dropdown-list">
                    <li value="home">Home</li>
                    <li value="user">Account</li>
                    <li value="help">Aiuto</li>
                </ul>
            </div>
        </nav>

    </header>

    <main class="container">

        <form>

            <div>
                <label for="km">Quanti km dovete fare?</label>
                <input type="text" id="km">
            </div>

            <div>
                <label for="age">Quanti anni hai/ha?</label>
                <input type="text" id="age">
            </div>

            <button type="submit" id="submit-button">Invia</button>

        </form>

        <div id="inputted-km">Chilometri inseriti: 0 km</div>
        <div id="inputted-age">Età inserita: 0 anni</div>
        <div id="ticket-price">Prezzo del Biglietto: 0,00€</div>

    </main>

</body>

</html>
